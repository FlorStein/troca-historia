<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troca · De Buenos Aires a Río</title>
<style>
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,900&f[]=general-sans@400&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&display=swap');
:root { --story-font: Satoshi, Arial, sans-serif; }
:root[data-font="general-sans"] { --story-font: 'General Sans', Arial, sans-serif; }
:root[data-font="instrument-sans"] { --story-font: 'Instrument Sans', Arial, sans-serif; }
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #18334b; color: #fff8ef; font: 16px/1.55 'DM Sans', sans-serif; }
.stage { position: sticky; top: 0; height: 100svh; overflow: hidden; isolation: isolate; }
.shot, .clouds, .scrim { position: absolute; inset: 0; width: 100%; height: 100%; }
.shot, .clouds { object-fit: cover; }
.city { object-position: 62% top; }
.clouds { background: #527891; }
.desktop-film { display: none; }
.opening-veil { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .opening-veil {
    display: block;
    position: absolute;
    z-index: 3;
    inset: 0;
    background: #18334b;
    opacity: 0;
    pointer-events: none;
    transition: opacity .65s ease-out;
  }
  .film-starting .opening-veil { opacity: 1; transition: none; }
  .film-starting .stage :is(.shot, .clouds, .air, .room) { visibility: hidden; }
}
html.film-mode { overflow: hidden; }
@media (min-width: 900px) and (pointer: fine) {
  .film-mode .stage {
    --video-side: max(0px, calc((100% - 100svh * 16 / 9) / 2));
    --video-top: max(0px, calc((100% - 100vw * 9 / 16) / 2));
    --video-gutter: clamp(1rem, 2vw, 2.25rem);
  }
  html.film-mode .head {
    inset: var(--video-top) var(--video-side) auto;
    padding-inline: var(--video-gutter);
  }
  html.film-mode .scroll-cue:not([hidden]) {
    right: calc(var(--video-side) + var(--video-gutter));
    bottom: calc(var(--video-top) + var(--video-gutter));
  }
}
.film-mode .desktop-film { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #10273b; }
.film-mode .chapter:first-child .copy { left: 50%; bottom: auto; top: 50%; transform: translate(-50%,-50%); text-align: center; border: 0; background: transparent; pointer-events: none; overflow: visible; }
.film-mode .chapter:first-child .copy h1 { font: 750 clamp(3.25rem,9vw,9rem)/1.05 'Playfair Display', Georgia, serif; letter-spacing: -.035em; color: #fff; text-shadow: 0 2px 18px #081c2cbf; animation: title-depth 1.7s cubic-bezier(.2,.65,.3,1) both; }
@keyframes title-depth {
  from { opacity: 0; scale: .76; }
  to { opacity: 1; scale: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  html.film-starting .copy { visibility: hidden; }
}
.film-mode .chapter:first-child .copy :is(small,p) { display: none; }
@keyframes welcome-in {
  from { opacity: 0; translate: 0 .65rem; }
  to { opacity: 1; translate: 0; }
}
.scroll-cue { display: none; }
.film-mode .scroll-cue:not([hidden]) { position: absolute; z-index: 2; right: clamp(1rem,4vw,4rem); bottom: 2rem; display: flex; align-items: center; gap: .7rem; padding: .65rem 1rem; border-radius: 999px; background: #10273be8; color: #fff8ef; }
.film-mode .scroll-cue.is-welcome { animation: welcome-in 1s .55s ease-out both; }
.film-mode .stage.is-welcome .scrim { opacity: .35; transition: opacity 1.2s ease; }
@media (max-width: 899px), (pointer: coarse) {
  .film-mode .desktop-film { object-fit: cover; }
  .film-mode .scroll-cue:not([hidden]) { bottom: 1rem; right: 1rem; font-size: .8rem; }
  html.film-mode .copy { bottom: 4.25rem; }
  html.film-mode .chapter:first-child .copy { bottom: auto; }
}
.film-mode .clouds, .film-mode #rio, .film-mode #beach, .film-mode .air, .film-mode .room { display: none; }
.air { position: absolute; inset: 0; overflow: hidden; pointer-events: none; perspective: 46rem; }
.air i { position: absolute; inset: -18%; opacity: 0; background: radial-gradient(ellipse at 14% 68%,#e4eff7c9,transparent 38%),radial-gradient(ellipse at 93% 27%,#f8ece1dd,transparent 37%); }
.scrim { background: linear-gradient(0deg,#081c2cf2,transparent 65%),linear-gradient(90deg,#081c2c70,transparent 80%); }
.room { position: absolute; inset: 0; pointer-events: none; }
.room::before { content: ''; position: absolute; inset: 9% 10% 27%; border: clamp(5px,1.15vw,18px) solid #674c37; box-shadow: 0 0 0 100vmax #e5cdb5, inset 0 0 30px #31241880; }
.room::after { content: ''; position: absolute; left: 51%; top: 10%; bottom: 28%; width: clamp(3px,.55vw,9px); background: #674c37; }
.head { position: absolute; z-index: 2; inset: 0 0 auto; padding: 1rem clamp(1rem,5vw,5rem); display: flex; justify-content: space-between; background: linear-gradient(#10273bb8,transparent); }
.head a { color: inherit; font: 600 1.6rem Fraunces, Georgia, serif; text-decoration: none; }
button, .button { background: #faeee5; color: #18334b; padding: .6rem 1rem; border: 0; border-radius: 999px; font: inherit; cursor: pointer; }
.chapters { position: relative; margin-top: -100svh; pointer-events: none; }
.chapter { min-height: 165svh; padding: 1rem clamp(1rem,6vw,6rem); }
.chapter:last-child { min-height: 100svh; }
.copy { position: sticky; top: 47svh; width: min(38rem,100%); background: #10273bf2; padding: clamp(1rem,2.5vw,2rem); border-left: 2px solid #c9b79f; }
.copy h1, .copy h2 { font: 600 clamp(2rem,4.8vw,4.5rem)/1 Fraunces, Georgia, serif; margin: .35rem 0 .65rem; }
.copy p { margin: .45rem 0; }
.copy small { color: #e5cdb5; }
.copy a { pointer-events: auto; }
.button { display: inline-block; margin-top: .65rem; text-decoration: none; }
.credit { font-size: .78rem; color: #faeee5; }
@media (max-width: 520px) { .copy { top: 48svh; } .chapter { min-height: 150svh; } }
@media (max-height: 560px) { .copy { top: 24svh; } }
.enhanced .chapters { z-index: 1; }
.enhanced .copy { top: auto; position: fixed; left: clamp(1rem,6vw,6rem); bottom: clamp(1.25rem,7vh,5rem); max-width: calc(100% - 2rem); max-height: calc(100svh - 6rem); overflow: auto; pointer-events: auto; background: #10273bd9; }
.enhanced .copy[hidden] { display: none; }
.enhanced .copy h1, .enhanced .copy h2 { font-size: clamp(1.8rem,4.3vw,3.8rem); }
html.film-mode .chapter:not(:first-child) .copy {
  top: 50%;
  left: 50%;
  bottom: auto;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: min(88vw, 36rem);
  padding: clamp(.7rem, 2vw, 1.25rem) clamp(1rem, 3vw, 2rem);
  border: 0;
  background: transparent;
  text-align: center;
  color: #fff;
}
html.film-mode .chapter:not(:first-child) h2 {
  margin: 0;
  font-size: clamp(1.45rem, 4vw, 3.15rem);
  line-height: 1.08;
  text-wrap: balance;
  text-shadow: 0 2px 18px #081c2cbf;
}
.film-mode .scrim { background: radial-gradient(ellipse at center, #081c2c63, transparent 58%); }
.copy h1, .copy h2, .film-mode .chapter:first-child .copy h1 { font-family: var(--story-font); font-weight: 400; letter-spacing: -.035em; }
.copy h2 .line { display: block; }
.film-mode .chapter:first-child .copy { width: 94vw; max-width: none; padding: 0; }
.film-mode .chapter:first-child .copy h1 {
  margin: 0;
  font-size: clamp(3rem, min(16vw, 27svh), 18rem);
  font-weight: 900;
  line-height: .84;
  letter-spacing: -.075em;
  color: #142a3b;
  text-shadow: none;
}
.film-mode .chapter:first-child .copy h1 span { display: block; }
@media (max-width: 899px), (pointer: coarse) {
  html.film-mode { touch-action: pan-x pinch-zoom; overscroll-behavior: none; }
  html.film-mode .chapter:first-child .copy { width: 90vw; }
  html.film-mode .chapter:first-child .copy h1 { font-size: clamp(2rem, 15vw, 7rem); line-height: .9; }
  html.film-mode .scroll-cue:not([hidden]) { bottom: max(1rem, env(safe-area-inset-bottom)); }
}
.film-mode .chapter:first-child .copy::after {
  content: '';
  position: absolute;
  inset: 18% -2% 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 17% 76%, #e5e1d8 2%, #e5e1d8ad 12%, transparent 31%),
    radial-gradient(ellipse at 36% 88%, #d5d8d6dc 3%, #d5d8d670 17%, transparent 34%),
    radial-gradient(ellipse at 83% 20%, #ebe6dcd9 4%, #ebe6dc80 14%, transparent 31%);
  filter: blur(clamp(8px, 1.55vw, 26px));
  animation: foreground-clouds 5s ease-out both;
}
@keyframes foreground-clouds {
  0% { opacity: 0; transform: translate3d(-7%, 6%, 0) scale(.97); }
  26% { opacity: .8; }
  72% { opacity: .55; }
  100% { opacity: .18; transform: translate3d(9%, -1%, 0) scale(1.07); }
}
.film-mode .stage.is-welcome .scrim { opacity: 0; }
.copy .wordmark { font: inherit; letter-spacing: inherit; }
.head a.wordmark, .scroll-cue, .lang, .final-entry { font-family: var(--story-font); font-weight: 400; }
html.film-mode .chapter:last-child .copy { z-index: 3; }
html.film-mode .chapter:last-child .button { margin: .85rem 0 0; pointer-events: auto; animation: entry-in .65s .45s ease both; }
@keyframes entry-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stage { position: relative; height: 55vh; } .chapters { margin: 0; } .chapter { min-height: auto; padding-block: 1rem; } .copy { position: static; } }
</style>
<script>
document.documentElement.classList.add('film-starting');
const previewFont = new URLSearchParams(location.search).get('font');
if (['general-sans', 'instrument-sans'].includes(previewFont)) {
  document.documentElement.dataset.font = previewFont;
}
</script>
</head>
<body>
<main>
  <div class="stage">
    <img class="shot city" id="ba" alt="" src="https://images.unsplash.com/photo-1589909202802-8f4aadce1849?auto=format&amp;fit=crop&amp;w=2000&amp;q=85">
    <video class="clouds" id="clouds" aria-hidden="true" muted loop playsinline preload="metadata" src="https://videos.pexels.com/video-files/7317304/7317304-hd_1920_1080_25fps.mp4"></video>
    <img class="shot" id="rio" alt="" src="https://images.unsplash.com/photo-1483729558449-99ef09a8c325?auto=format&amp;fit=crop&amp;w=2000&amp;q=85">
    <img class="shot" id="beach" alt="" src="https://commons.wikimedia.org/wiki/Special:FilePath/Praia_de_Ipanema_vista_do_Arpoador.jpg?width=1600">
    <div class="air" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="room" id="room" aria-hidden="true"></div>
    <video class="desktop-film" id="desktop-film" data-src="vuelo-troca-pausado.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="scrim" aria-hidden="true"></div>
    <div class="scroll-cue" id="scroll-cue" hidden><span aria-hidden="true">↑↓</span><span data-pt="Deslize para avançar ou voltar">Deslizá para avanzar o volver</span></div>
    <header class="head"><a class="wordmark" href="index.html">Troca</a><button type="button" id="lang" aria-label="Português">PT</button></header>
    <div class="opening-veil" aria-hidden="true"></div>
  </div>
  <div class="chapters">
    <section class="chapter"><div class="copy">
      <h1><span data-pt="DESCUBRA">DESCUBRÍ</span> <span class="wordmark">TROCA</span></h1>
    </div></section>
    <section class="chapter"><div class="copy">
      <h2 data-pt="Um novo jeito de viajar">Una nueva forma de viajar</h2>
    </div></section>
    <section class="chapter"><div class="copy">
      <h2><span class="line" data-pt="Troque de casa">Intercambiá tu casa</span><span class="line" data-pt="Mude de paisagem">Cambiá de paisaje</span></h2>
    </div></section>
    <section class="chapter"><div class="copy">
      <h2 data-pt="Descubra cada lugar como quem vive lá">Descubrí cada lugar como alguien de ahí</h2>
    </div></section>
    <section class="chapter"><div class="copy">
      <h2 data-pt="Sinta-se em casa, longe de casa">Sentite en casa, lejos de casa</h2>
    </div></section>
    <section class="chapter"><div class="copy">
      <h2><span data-pt="Você chegou,">Llegaste,</span> <span class="wordmark" data-pt="trocou">trocaste</span></h2>
      <a class="button final-entry" href="https://troca-2q9.pages.dev/">ENTRAR</a>
    </div></section>
  </div>
</main>
<script>
const chapters = [...document.querySelectorAll('.chapter')];
const captions = chapters.map(chapter => chapter.querySelector('.copy'));
const airLayers = [...document.querySelectorAll('.air i')];
const [ba, clouds, rio, beach, room] = ['ba', 'clouds', 'rio', 'beach', 'room'].map(id => document.getElementById(id));
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const desktop = matchMedia('(min-width: 900px) and (pointer: fine)');
const film = document.getElementById('desktop-film');
const scrollCue = document.getElementById('scroll-cue');
const stage = document.querySelector('.stage');
const clamp = value => Math.min(1, Math.max(0, value));
const ease = value => { const t = clamp(value); return t * t * (3 - 2 * t); };
let frame = 0;
let flying = false;
let filmLoaded = false;
let wheelAt = -Infinity;
let wheelDirection = 0;
let filmWasActive = false;
let manualPlayback = false;
let flightFrame = 0;
let flightDestination = null;
const chapterTimes = () => desktop.matches
  ? [4, 9, 14, 19, 25, 33]
  : [2.8, 6, 8.7, 11.5, 19, 25.2];
const filmChapter = () => chapterTimes().findLastIndex(time => time <= film.currentTime);

function revealCaption(caption, index, active, times) {
  const visible = index === active;
  caption.hidden = !visible;
  caption.inert = !visible;
  if (!visible) return;

  const elapsed = film.currentTime - times[index];
  const remaining = (times[index + 1] ?? Infinity) - film.currentTime;
  const entrance = index === 0 ? 1 : ease(elapsed / .65);
  const exit = ease(remaining / .48);
  caption.style.opacity = Math.min(entrance, exit);
  caption.inert = entrance < .55 || exit < .55;
}

function render() {
  frame = 0;
  const stops = chapters.map(chapter => chapter.getBoundingClientRect().top);
  const segment = index => clamp(-stops[index] / Math.max(1, stops[index + 1] - stops[index]));
  const immersive = !reduced.matches;
  const useFilm = immersive;
  const source = desktop.matches ? film.dataset.src : 'vuelo-troca-vertical.mp4';
  if (useFilm && film.getAttribute('src') !== source) {
    filmLoaded = false;
    film.src = source;
  }
  document.documentElement.classList.toggle('film-mode', useFilm && filmLoaded && !film.error);
  const filmMode = useFilm && filmLoaded && !film.error;
  document.documentElement.classList.toggle('film-starting', useFilm && !filmLoaded && !film.error);
  document.documentElement.classList.toggle('enhanced', immersive);
  if (filmMode !== filmWasActive) {
    filmWasActive = filmMode;
    if (filmMode) {
      window.scrollTo(0, 0);
      if (!manualPlayback) film.play().catch(() => {});
    } else film.pause();
  }
  const active = filmMode ? filmChapter() : Math.max(0, stops.findLastIndex(top => top <= 1));
  const welcome = filmMode && active === 0;
  stage.classList.toggle('is-welcome', welcome);
  scrollCue.classList.toggle('is-welcome', welcome);
  scrollCue.hidden = !filmMode;
  const times = filmMode ? chapterTimes() : null;
  captions.forEach((caption, index) => {
    if (filmMode) {
      revealCaption(caption, index, active, times);
    } else {
      caption.hidden = immersive && (index !== active || (active < chapters.length - 1 && segment(active) > .82));
      caption.style.removeProperty('opacity');
      caption.inert = false;
    }
  });
  if (filmMode) {
    if (flying) {
      flying = false;
      clouds.pause();
    }
    if (!film.paused && !film.ended) schedule();
    return;
  }
  const takeoff = ease((segment(0) - .62) / .38);
  const descent = ease((segment(2) - .65) / .35);
  const coast = ease((segment(3) - .62) / .38);
  const doorway = ease((segment(4) - .56) / .44);
  ba.style.transform = reduced.matches ? '' : 'scale(' + (1 + takeoff * .15) + ')';
  ba.style.opacity = 1;
  clouds.style.opacity = takeoff;
  const flight = clamp((segment(0) + segment(1) + segment(2) - .62) / 2.38);
  clouds.style.transform = immersive ? 'scale(' + (1 + flight * .34) + ') translateY(' + (-flight * 7) + '%)' : '';
  airLayers.forEach((layer, index) => {
    const pass = clamp(flight * 1.8 - index * .31);
    const entryMist = Math.sin(Math.PI * takeoff);
    const exitMist = Math.sin(Math.PI * descent);
    layer.style.opacity = immersive ? Math.min(.76, Math.sin(Math.PI * pass) * .29 + (entryMist + exitMist) * .47) : 0;
    layer.style.transform = 'translateZ(' + (-420 + 570 * pass) + 'px) rotate(' + (index - 1) * 13 + 'deg)';
  });
  rio.style.opacity = descent;
  rio.style.transform = reduced.matches ? '' : 'scale(' + (1 + coast * .16) + ')';
  beach.style.opacity = coast;
  room.style.opacity = doorway;
  room.style.transform = reduced.matches ? '' : 'scale(' + (2.65 - doorway * 1.65) + ')';
  const shouldFly = immersive && takeoff > 0 && descent < 1;
  if (shouldFly !== flying) {
    flying = shouldFly;
    if (flying) clouds.play().catch(() => {});
    else clouds.pause();
  }
}

function schedule() {
  if (!frame) frame = requestAnimationFrame(render);
}
addEventListener('scroll', schedule, { passive: true });
addEventListener('resize', schedule);
reduced.addEventListener('change', schedule);
desktop.addEventListener('change', schedule);
film.addEventListener('loadeddata', () => {
  filmLoaded = true;
  schedule();
});
function travelToTime(target) {
  cancelAnimationFrame(flightFrame);
  const start = film.currentTime;
  const distance = target - start;
  const duration = Math.min(2400, Math.max(800, Math.abs(distance) * 390));
  let elapsed = 0;
  let previous = performance.now();

  function advance(now) {
    if (!filmWasActive) {
      flightDestination = null;
      return;
    }
    const delta = Math.min(42, now - previous);
    previous = now;
    if (!film.seeking) {
      elapsed += delta;
      const progress = clamp(elapsed / duration);
      film.currentTime = start + distance * ease(progress);
      schedule();
      if (progress === 1) {
        flightDestination = null;
        return;
      }
    }
    flightFrame = requestAnimationFrame(advance);
  }

  flightFrame = requestAnimationFrame(advance);
}

function stepFilm(direction) {
  manualPlayback = true;
  film.pause();
  const current = flightDestination ?? filmChapter();
  const next = Math.max(0, Math.min(chapters.length - 1, current + direction));
  const times = chapterTimes();
  const hold = Math.min(times[next] + .68, film.duration - .06);
  if (flightDestination === next || (flightDestination === null && Math.abs(film.currentTime - hold) < .04)) return;
  flightDestination = next;
  travelToTime(hold);
}
addEventListener('wheel', event => {
  if (!filmWasActive || reduced.matches || !filmLoaded || film.error ||
      event.ctrlKey || !event.deltaY || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
  const panel = event.target.closest?.('.copy');
  if (panel && (event.deltaY > 0
    ? panel.scrollTop + panel.clientHeight < panel.scrollHeight - 1
    : panel.scrollTop > 1)) return;
  event.preventDefault();
  const now = performance.now();
  const direction = Math.sign(event.deltaY);
  const fresh = now - wheelAt > 160 || direction !== wheelDirection;
  wheelAt = now;
  wheelDirection = direction;
  if (fresh) stepFilm(direction);
}, { passive: false });
let touchStart;
addEventListener('touchstart', event => {
  const interactive = event.target.closest?.('a, button');
  const touch = event.touches[0];
  touchStart = !interactive && event.touches.length === 1 ? { x: touch.clientX, y: touch.clientY } : undefined;
}, { passive: true });
addEventListener('touchend', event => {
  if (touchStart === undefined || !filmWasActive || !event.changedTouches.length) return;
  const touch = event.changedTouches[0];
  const distance = touchStart.y - touch.clientY;
  const sideways = Math.abs(touchStart.x - touch.clientX);
  touchStart = undefined;
  if (Math.abs(distance) >= 40 && Math.abs(distance) > sideways) stepFilm(Math.sign(distance));
}, { passive: true });
addEventListener('touchcancel', () => { touchStart = undefined; }, { passive: true });
addEventListener('keydown', event => {
  const directions = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 };
  if (!filmWasActive || !directions[event.key] || event.repeat || event.defaultPrevented) return;
  event.preventDefault();
  stepFilm(directions[event.key]);
});
film.addEventListener('timeupdate', schedule);
film.addEventListener('playing', schedule);
film.addEventListener('seeked', schedule);
film.addEventListener('error', schedule);
const language = document.getElementById('lang');
const copy = [...document.querySelectorAll('[data-pt]')].map(node => [node, node.textContent]);
language.addEventListener('click', () => {
  const portuguese = document.documentElement.lang === 'es';
  document.documentElement.lang = portuguese ? 'pt-BR' : 'es';
  language.textContent = portuguese ? 'ES' : 'PT';
  language.setAttribute('aria-label', portuguese ? 'Español' : 'Português');
  copy.forEach(([node, spanish]) => { node.textContent = portuguese ? node.dataset.pt : spanish; });
});
render();
</script>
</body>
</html>
